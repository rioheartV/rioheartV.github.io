<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>メブキ・ガーデン アイテム図鑑</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: one reading column; sticky search + category chips; items as ledger cards, gear as compact tables. Single dusk-wood look matching the game. */
:root{
  --bg:#17130e; --panel:#241d16; --panel2:#2f261c; --line:#4a3c2c; --fg:#f3e7cf; --muted:#b8a684;
  --gold:#e8b44a; --leaf:#8cc163; --hp:#e07a6e; --st:#6fb0e0; --mp:#b493e8;
  --pix:"DotGothic16","Hiragino Kaku Gothic ProN",monospace;
  --body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.6}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--pix);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:28px;letter-spacing:.06em}
h1 b{color:var(--leaf);font-weight:400}
h2{font-size:20px;color:var(--gold);display:flex;align-items:baseline;gap:10px}
h2 small{font-family:var(--body);font-size:12px;color:var(--muted)}
.lead{color:var(--muted);margin:0;max-width:65ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
#q{width:100%;font:inherit;font-size:15px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 12px}
#q:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 11px;cursor:pointer}
.chip[aria-pressed="true"]{color:var(--bg);background:var(--gold);border-color:var(--gold)}
.chip span{font-variant-numeric:tabular-nums;opacity:.75;margin-left:4px}
.tabs{display:flex;gap:4px}
.tab{font-family:var(--pix);font-size:15px;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:4px 10px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--gold)}
.count{color:var(--muted);font-size:12px}
.list{display:flex;flex-direction:column;gap:8px}
.it{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.it .nm{font-weight:700;font-size:15px;min-width:0;display:flex;align-items:center;gap:8px}
.ic{width:32px;height:32px;image-rendering:pixelated;flex:none;background:var(--panel2);border-radius:4px}
.it .nm i{font-style:normal;font-family:var(--pix);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 5px;margin-left:8px;vertical-align:2px}
.it .pr{font-family:var(--pix);color:var(--gold);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.it .ef{grid-column:1/-1;font-size:13px}
.ef .h{color:var(--hp)}.ef .s{color:var(--st)}.ef .m{color:var(--mp)}
.it dl{grid-column:1/-1;margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px}
.it dt{color:var(--muted);white-space:nowrap}
.it dd{margin:0;min-width:0}
.it dd ul{margin:0;padding-left:1.1em}
.empty{color:var(--muted);padding:24px 0;text-align:center}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:400;color:var(--muted);background:var(--panel2);font-size:12px;letter-spacing:.04em}
td.n{font-weight:700;white-space:nowrap}
td.e{color:var(--leaf)}
tr:last-child td{border-bottom:0}
.sec{display:flex;flex-direction:column;gap:10px}
.note{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:6px">
    <h1><b>メブキ</b>・ガーデン アイテム図鑑</h1>
    <p class="lead">ゲーム内の全アイテムと装備の一覧です。売値は出荷箱に入れたときの1個あたりの値段。★は上質品で、通常品の約1.8倍で売れます。</p>
  </header>
  <div class="bar">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-items" aria-selected="true">アイテム</button>
      <button class="tab" role="tab" id="tab-gear" aria-selected="false">装備・道具</button>
    </div>
    <div id="itembar" style="display:flex;flex-direction:column;gap:8px">
      <input id="q" type="search" placeholder="名前・入手方法・使い道で検索（例：金鉱石、釣り、調理台）" autocomplete="off">
      <div class="chips" id="chips"></div>
    </div>
  </div>
  <main id="items" class="sec"><div class="count" id="count"></div><div class="list" id="list"></div></main>
  <main id="gear" class="sec" hidden></main>
</div>

const CATS=['すべて','作物','果物','畜産物','魚','料理','薬','素材','換金','道具'];
let cat='すべて';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function eff(e){return esc(e).replace(/HP\+\d+/g,'<span class="h">$&</span>').replace(/ST\+\d+/g,'<span class="s">$&</span>').replace(/MP\+\d+/g,'<span class="m">$&</span>')}
function renderChips(){const c=document.getElementById('chips');c.innerHTML='';
  for(const k of CATS){const n=k==='すべて'?D.rows.length:D.rows.filter(r=>r.c===k).length;const b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed',k===cat);b.innerHTML=esc(k)+'<span>'+n+'</span>';b.onclick=()=>{cat=k;renderChips();render()};c.append(b)}}
function render(){const q=document.getElementById('q').value.trim();
  const rs=D.rows.filter(r=>(cat==='すべて'||r.c===cat)&&(!q||[r.n,r.c,r.e,...r.s,...r.u].join(' ').includes(q)));
  document.getElementById('count').textContent=rs.length+' 件';
  const L=document.getElementById('list');
  L.innerHTML=rs.length?rs.map(r=>`<article class="it"><div class="nm"><img class="ic" alt="" src="${D.icons[r.i]||''}"><span>${esc(r.n)}</span><i>${esc(r.c)}</i></div><div class="pr">${r.p?r.p+' G':'—'}</div>${r.e?`<div class="ef">${eff(r.e)}</div>`:''}<dl><dt>入手</dt><dd><ul>${r.s.map(s=>'<li>'+esc(s)+'</li>').join('')}</ul></dd>${r.u.length?`<dt>使い道</dt><dd>${r.u.map(esc).join('、')}</dd>`:''}</dl></article>`).join(''):'<div class="empty">見つかりませんでした。別の言葉で検索してください。</div>'}
function tbl(head,rows){return`<div class="tbl"><table><thead><tr>${head.map(h=>'<th>'+h+'</th>').join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+r.map((c,i)=>`<td${i===0?' class="n"':i===1?' class="e"':''}>${c}</td>`).join('')+'</tr>').join('')}</tbody></table></div>`}
const mat=a=>a.map(([n,q])=>esc(n)+'×'+q).join('　');
function renderGear(){const g=D.gear,ups=D.ups,G=document.getElementById('gear');const by=n=>ups.find(u=>u.n===n);
  const sw=g.swords.map((s,i)=>[esc(s.n),s.v,i===0?'最初から持っている':mat((by(s.n)||{in:[]}).in.map(x=>[x[0],x[1]]))]);
  const wrows=[];for(const w of['spear','rune','staff','axe','pick','bow'])if(g.wn[w])g.wn[w].forEach((n,i)=>{if(i)wrows.push([esc(n),esc(g.wfx[w][i]),mat(by(n).in.map(x=>[x[0],x[1]]))])});
  const arm=[];for(const e of g.eq)for(const t of e.tiers)arm.push([esc(t.n),`${e.slot}・防御+${t.def}`+(t.mdef?`・魔防+${t.mdef}`:'')+(t.spd?`・移動+${Math.round(t.spd*100)}%`:''),mat(t.in)]);
  const tools=ups.filter(u=>/クワ|じょうろ|釣り竿/.test(u.n)).map(u=>[esc(u.n),esc(u.d),mat(u.in.map(x=>[x[0],x[1]]))+'（'+u.st+'）']);
  const acc=g.accs.map(a=>[esc(a.n),esc(a.d),mat(a.in)]);
  G.innerHTML=`
  <section class="sec"><h2>剣 <small>鍛冶炉で順番に強化</small></h2>${tbl(['名前','効果','材料'],sw)}</section>
  <section class="sec"><h2>そのほかの武器 <small>鍛冶炉で作る。武器スロットで持ち替え。オノ・ツルハシ・弓は得意な相手に約2.2倍</small></h2>
    <p class="note">槍：${esc(g.weap.spear)}／魔法剣：${esc(g.weap.rune)}／杖：${esc(g.weap.staff)}／オノ：${esc(g.weap.axe)}／ツルハシ：${esc(g.weap.pick)}／弓：${esc(g.weap.bow)}</p>${tbl(['名前','効果','材料'],wrows)}</section>
  <section class="sec"><h2>防具 <small>鍛冶炉。頭・体・盾・足は下から順に強化</small></h2>${tbl(['名前','効果','材料'],arm)}</section>
  <section class="sec"><h2>アクセサリー <small>作業台で作り、2つまで装備</small></h2>${tbl(['名前','効果','材料'],acc)}</section>
  <section class="sec"><h2>農具・釣り竿</h2>${tbl(['名前','効果','材料'],tools)}<p class="note">竹の釣り竿はゲンの釣り具屋でも300Gで買えます。</p></section>`}
function tab(t){const it=t==='items';document.getElementById('tab-items').setAttribute('aria-selected',it);document.getElementById('tab-gear').setAttribute('aria-selected',!it);
  document.getElementById('items').hidden=!it;document.getElementById('itembar').hidden=!it;document.getElementById('gear').hidden=it;try{localStorage.setItem('tab',t)}catch(e){}}
document.getElementById('tab-items').onclick=()=>tab('items');document.getElementById('tab-gear').onclick=()=>tab('gear');
document.getElementById('q').addEventListener('input',render);
renderChips();render();renderGear();
try{if(localStorage.getItem('tab')==='gear')tab('gear')}catch(e){}
</script>
